<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="railGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8B7355"/>
            <stop offset="50%" style="stop-color:#6F4E37"/>
            <stop offset="100%" style="stop-color:#8B7355"/>
        </linearGradient>
    </defs>
    
    <!-- Ana grup - eğimli tren rayları -->
    <g transform="translate(256, 256) rotate(-15) translate(-256, -256)">
        <!-- Sol ray -->
        <path d="M150 150 
                C 180 200, 180 300, 180 350 
                L 140 350 
                C 140 300, 140 200, 110 150 Z" 
              fill="url(#railGradient)"/>
        
        <!-- Sağ ray -->
        <path d="M362 150 
                C 392 200, 392 300, 392 350 
                L 352 350 
                C 352 300, 352 200, 322 150 Z" 
              fill="url(#railGradient)"/>
        
        <!-- Traversler -->
        <path d="M110 200 L402 200" stroke="url(#railGradient)" stroke-width="15"/>
        <path d="M115 250 L397 250" stroke="url(#railGradient)" stroke-width="15"/>
        <path d="M120 300 L392 300" stroke="url(#railGradient)" stroke-width="15"/>
        <path d="M125 350 L387 350" stroke="url(#railGradient)" stroke-width="15"/>
    </g>
</svg>
</svg>